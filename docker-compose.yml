services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    network_mode: host
    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    volumes:
      - traefik-letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  obsidian-headless:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./vault:/vault
      - obsidian-cache:/root/.obsidian-headless
    environment:
      - OBSIDIAN_EMAIL=${OBSIDIAN_EMAIL}
      - OBSIDIAN_PASSWORD=${OBSIDIAN_PASSWORD}
      - VAULT_PASSWORD=${VAULT_PASSWORD}
      - VAULT_NAME=${VAULT_NAME}
    command: bash -c "
      npm install -g obsidian-headless &&
      ob login --email $$OBSIDIAN_EMAIL --password $$OBSIDIAN_PASSWORD &&
      ob sync-setup --vault $$VAULT_NAME --path /vault --password "$$VAULT_PASSWORD" --device-name 'Hostinger' &&
      ob sync --path /vault --continuous
      "

  obsidian-api:
    image: node:22
    restart: unless-stopped
    working_dir: /tmp/app
    depends_on:
      - obsidian-headless
    volumes:
      - ./obsidian-api.js:/app/server.js
      - ./vault:/vault
      - sqlite-data:/data
    command: bash -c "rm -rf /tmp/repo && mkdir -p /tmp/app && git clone https://github.com/seb7152/obsidian-headless-mcp.git /tmp/repo && cat /tmp/repo/obsidian-api.js > /tmp/app/server.js && cat /tmp/repo/vault-indexer.js > /tmp/app/vault-indexer.js && npm install express cors js-yaml better-sqlite3 chokidar && node server.js"
    expose:
      - "3000"
    environment:
      - VAULT_PATH=/vault
      - SQLITE_PATH=/data/vault-index.db
      - PORT=3000
      - API_TOKEN=${API_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obsidian-api.rule=Host(`obsidian-api.${DOMAIN}`)"
      - "traefik.http.routers.obsidian-api.entrypoints=websecure"
      - "traefik.http.routers.obsidian-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian-api.loadbalancer.server.port=3000"

  obsidian-mcp:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - obsidian-api
    volumes:
      - ./obsidian_mcp.py:/app/obsidian_mcp.py:ro
      - ./oauth:/app/oauth:ro
      - oauth-data:/data
    command: bash -c "pip install --quiet mcp httpx uvicorn aiosqlite starlette python-multipart && python obsidian_mcp.py"
    expose:
      - "3001"
    environment:
      - OBSIDIAN_API_URL=http://obsidian-api:3000/api
      - API_TOKEN=${API_TOKEN}
      - PORT=3001
      - MCP_AUTH_ENABLED=${MCP_AUTH_ENABLED:-true}
      - MCP_USER_PASSWORD=${MCP_USER_PASSWORD}
      - MCP_PUBLIC_URL=https://mcp.${DOMAIN}
      - MCP_TOKEN_TTL_SECONDS=${MCP_TOKEN_TTL_SECONDS:-3600}
      - MCP_REFRESH_TTL_DAYS=${MCP_REFRESH_TTL_DAYS:-14}
      - MCP_OAUTH_DB_PATH=/data/oauth.db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.obsidian-mcp.rule=Host(`mcp.${DOMAIN}`)"
      - "traefik.http.routers.obsidian-mcp.entrypoints=websecure"
      - "traefik.http.routers.obsidian-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.obsidian-mcp.loadbalancer.server.port=3001"

volumes:
  traefik-letsencrypt:
  obsidian-cache:
  sqlite-data:
  oauth-data:
